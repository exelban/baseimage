version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /alpine
      - /golang
      - /node
      - /mongobackup
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mongo"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
