name: Deploy to docker hub

on:
  push:
    branches:
      - master
    paths:
      - 'alpine/**'
      - 'golang/**'
      - 'node/**'
      - 'mongobackup/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed images
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed=$(printf 'alpine\ngolang\nnode\nmongobackup\n')
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            changed=$(git diff --name-only HEAD^ HEAD)
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          fi
          images=$(echo "$changed" | awk -F/ '/^(alpine|golang|node|mongobackup)\//{print $1}' | sort -u | jq -R . | jq -sc .)
          echo "changed images: $images"
          echo "images=$images" >> $GITHUB_OUTPUT

  deploy:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7

      - name: Read image version from Makefile
        run: |
          tag=$(sed -nE "s/^$(echo '${{ matrix.image }}' | tr 'a-z' 'A-Z')_TAG *= *\"?([^\"]+)\"?.*/\1/p" Makefile)
          if [ -z "$tag" ]; then
            echo "no tag found in Makefile for ${{ matrix.image }}" >&2
            exit 1
          fi
          echo "IMAGE_TAG=$tag" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            exelban/baseimage:${{ env.IMAGE_TAG }}
            exelban/baseimage:${{ matrix.image }}-latest

      - name: Scan image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: exelban/baseimage:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: '0'
